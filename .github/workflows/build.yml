name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository contents
        run: ./scripts/Test-Repository.ps1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained Windows distribution
        run: ./build.ps1 -SelfContained
      - name: Compile native diagnostic fixtures without game assets
        run: ./build.ps1 -NativeOnly -SmokeTest
      - name: Run launcher self-tests without game assets
        run: ./scripts/Test-Repository.ps1 -RunSelfTest
      - name: Verify owned-process cleanup failure handling with fake APIs
        run: python scripts/test_native_cleanup.py --out build/native-cleanup-results.json
      - name: Verify smoke tools reject non-fixture folders before writing
        run: python scripts/test_smoke_paths.py --out build/smoke-paths-results.json
